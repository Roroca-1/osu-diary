name: Publish Linux release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify version matches tag
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci --no-audit --no-fund && npm test && npm run test:ui
        env:
          REALM_DISABLE_ANALYTICS: '1'
      - run: sudo apt-get update -qq && sudo apt-get install -y zstd
      - run: python3 scripts/build-release.py
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "osu-diary $GITHUB_REF_NAME — Linux x86-64" --notes-file .github/release-notes.md dist/osu-diary-*.tar.gz dist/*-source.tar.* dist/SHA256SUMS
